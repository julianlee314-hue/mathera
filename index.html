<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Mathera</title>
<meta name="theme-color" content="#0a0e17"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0e17; --panel:#121826; --ink:#eef3ff; --muted:#8b97b3;
  --line:rgba(255,255,255,.08);
  --seed:#8a93a8; --growing:#9dce7a; --proven:#2f7a3a;
  --accent:#6ea8ff;
  --count:#4ade80; --operate:#c4a574; --relate:#9bb7ff;
  --solve:#e8eef8; --prove:#f0e6c8; --motion:#5ec8d8; --space:#c4a0ff;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Inter,system-ui,sans-serif;color:var(--ink);
  background:
    radial-gradient(900px 500px at 15% -5%, rgba(110,168,255,.14), transparent 55%),
    radial-gradient(700px 420px at 85% 5%, rgba(196,160,255,.12), transparent 50%),
    radial-gradient(600px 400px at 50% 110%, rgba(74,222,128,.06), transparent 45%),
    var(--bg);
  min-height:100%;
  overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{max-width:1100px;margin:0 auto;padding:1rem 1.1rem 7rem;min-height:100%}

.top{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.75rem}
.brand{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:1.35rem;letter-spacing:-.02em}
.brand em{font-style:normal;background:linear-gradient(120deg,#6ea8ff,#8b7cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;gap:.35rem}
.nav button{
  padding:.4rem .85rem;border-radius:999px;border:1px solid var(--line);
  color:var(--muted);font-size:.8125rem;font-weight:500;background:rgba(255,255,255,.03)
}
.nav button.on{background:#eef3ff;color:#0a0e17;border-color:transparent}

.crumb{display:flex;align-items:center;gap:.4rem;min-height:1.5rem;margin-bottom:.65rem;color:var(--muted);font-size:.8rem;flex-wrap:wrap}
.crumb button{color:var(--muted)}
.crumb button:hover{color:var(--ink)}
.crumb .sep{opacity:.4}

/* universe */
.universe{position:relative;border:1px solid var(--line);border-radius:1.35rem;overflow:hidden;
  background:linear-gradient(180deg,#0c1220 0%,#10182a 40%,#0b1524 100%);
  min-height:560px;padding:1.5rem 1rem 2rem}
.universe::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:radial-gradient(1.5px 1.5px at 10% 20%,#fff,transparent),
    radial-gradient(1px 1px at 30% 70%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 70% 30%,#fff,transparent),
    radial-gradient(1px 1px at 85% 60%,#fff,transparent),
    radial-gradient(1px 1px at 45% 15%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 55% 80%,#fff,transparent);
}
.uni-title{position:relative;text-align:center;z-index:1;margin-bottom:1.25rem}
.uni-title h1{margin:0;font-family:Fraunces,Georgia,serif;font-size:clamp(1.6rem,4vw,2.2rem);letter-spacing:-.02em}
.uni-title p{margin:.35rem 0 0;color:var(--muted);font-size:.85rem;letter-spacing:.12em;text-transform:uppercase}

.path-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.worlds{position:relative;z-index:1;display:grid;grid-template-columns:repeat(7,1fr);gap:.5rem;align-items:end;padding:2.5rem .4rem 1rem;min-height:420px}
@media(max-width:820px){
  .worlds{grid-template-columns:repeat(2,1fr);gap:1rem;align-items:stretch}
  .universe{min-height:auto}
}
.world{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:.55rem;
  padding:.6rem .35rem .85rem;border-radius:1.1rem;border:1px solid transparent;
  transition:transform .2s, border-color .2s, background .2s;
}
.world:hover:not(.locked){transform:translateY(-4px);background:rgba(255,255,255,.03);border-color:var(--line)}
.world.locked{opacity:.42;cursor:default}
.orb{
  width:72px;height:72px;border-radius:50%;display:grid;place-items:center;
  position:relative;box-shadow:0 12px 30px rgba(0,0,0,.35);
}
.orb svg{width:48px;height:48px}
.orb .lock{
  position:absolute;inset:auto 6px -4px auto;width:22px;height:22px;border-radius:50%;
  background:#1a2233;border:1px solid var(--line);display:grid;place-items:center;font-size:10px
}
.w-roman{font-size:.7rem;letter-spacing:.14em;color:var(--muted);font-weight:600}
.w-name{font-family:Fraunces,Georgia,serif;font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
.w-bar{width:54px;height:4px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.w-bar i{display:block;height:100%;border-radius:inherit;background:currentColor;opacity:.85}
.w-frac{font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
.world[data-id="count"]{color:var(--count)}
.world[data-id="operate"]{color:var(--operate)}
.world[data-id="relate"]{color:var(--relate)}
.world[data-id="solve"]{color:var(--solve)}
.world[data-id="prove"]{color:var(--prove)}
.world[data-id="motion"]{color:var(--motion)}
.world[data-id="space"]{color:var(--space)}
.orb.count{background:radial-gradient(circle at 35% 30%,#9bf0b5,#1f6b3a 60%,#0d2a18)}
.orb.operate{background:radial-gradient(circle at 35% 30%,#e8d2a8,#7a5a32 60%,#2a1c0e)}
.orb.relate{background:radial-gradient(circle at 35% 30%,#c8d6ff,#3a5088 60%,#152038)}
.orb.solve{background:radial-gradient(circle at 35% 30%,#f5f8ff,#6a7a98 55%,#1c2436)}
.orb.prove{background:radial-gradient(circle at 35% 30%,#fff4d6,#a89058 55%,#2a2414)}
.orb.motion{background:radial-gradient(circle at 35% 30%,#a8f0ff,#1f6a7a 55%,#0c2430)}
.orb.space{background:radial-gradient(circle at 35% 30%,#e0c8ff,#5a3a98 55%,#180c30)}

/* world map */
.view-universe.hide{display:none}
.view-world,.view-skill{display:none}
.view-world.show,.view-skill.show{display:block}

.world-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:.65rem;flex-wrap:wrap}
.world-head h2{margin:0;font-family:Fraunces,Georgia,serif;font-size:1.45rem}
.world-head .meta{color:var(--muted);font-size:.82rem;margin-top:.2rem}
.world-actions{display:flex;gap:.4rem;align-items:center}
.ghost{
  padding:.4rem .75rem;border-radius:999px;border:1px solid var(--line);
  color:var(--muted);font-size:.78rem;background:rgba(255,255,255,.03)
}
.ghost:hover{color:var(--ink);border-color:rgba(255,255,255,.2)}

.pills{display:flex;gap:.35rem;overflow-x:auto;padding-bottom:.4rem;margin-bottom:.55rem;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.dpill{
  flex:0 0 auto;padding:.35rem .65rem;border-radius:999px;border:1px solid var(--line);
  font-size:.72rem;color:var(--muted);background:rgba(255,255,255,.03);font-variant-numeric:tabular-nums
}
.dpill.on{background:rgba(110,168,255,.18);border-color:rgba(110,168,255,.45);color:var(--ink)}

.stage{
  position:relative;border:1px solid var(--line);border-radius:1.2rem;overflow:hidden;
  height:min(72vh,780px);min-height:420px;touch-action:none;cursor:grab;
  background:#0b101c;
}
.stage.panning{cursor:grabbing}
.stage[data-metaphor="tree"],
.stage[data-metaphor="grove"]{
  background:
    radial-gradient(900px 420px at 50% 8%, rgba(90,200,120,.16), transparent 55%),
    linear-gradient(180deg,#152218,#0a120c 55%,#0c1410);
}
.stage[data-metaphor="city"]{background:linear-gradient(180deg,#1a140c,#0e0a06)}
.stage[data-metaphor="bridges"]{background:linear-gradient(180deg,#121a2c,#0a101c)}
.stage[data-metaphor="mountains"]{background:linear-gradient(180deg,#141c2a,#0a1018 55%,#151810)}
.stage[data-metaphor="palace"]{background:linear-gradient(180deg,#1c1810,#0e0c08)}
.stage[data-metaphor="ocean"]{background:linear-gradient(180deg,#0a1820,#061018 40%,#0a2030)}
.stage[data-metaphor="cosmos"]{background:radial-gradient(ellipse at 50% 40%,#1a1030,#07040f 70%)}

#mapSvg{width:100%;height:100%;display:block}
.cluster{cursor:pointer}
.cluster:hover .cluster-hit{stroke:rgba(255,255,255,.4)!important}
.cluster-label{fill:var(--muted);font-size:11px;font-family:Inter,sans-serif;font-weight:600;letter-spacing:.06em}
.cluster-name{fill:rgba(238,243,255,.75);font-size:10px;font-family:Fraunces,Georgia,serif}
.sknode{cursor:pointer}
.sknode.dim{opacity:.22;pointer-events:none}
.sknode:hover circle:not(.skhit){filter:brightness(1.25)}
.skill-label{fill:#eef3ff;font-size:9px;font-family:Inter,sans-serif;pointer-events:none}

.hint-bar{
  display:flex;justify-content:center;gap:1rem;margin-top:.55rem;
  font-size:.72rem;color:var(--muted);flex-wrap:wrap
}
.hint-bar span{opacity:.85}

/* skill detail */
.panel{
  border:1px solid var(--line);border-radius:1.2rem;background:rgba(255,255,255,.03);
  padding:1.1rem 1.1rem 1.25rem
}
.detail-art{
  border-radius:1rem;overflow:hidden;aspect-ratio:16/9;margin-bottom:1rem;
  background:
    radial-gradient(circle at 30% 40%, rgba(110,168,255,.25), transparent 45%),
    linear-gradient(160deg,#1a2740,#0f1828);
  display:grid;place-items:center
}
.detail-art svg{width:40%;max-width:200px;opacity:.95}
#skillTitle{margin:0 0 .35rem;font-family:Fraunces,Georgia,serif;font-size:1.45rem}
#skillMeta{color:var(--muted);font-size:.85rem;margin-bottom:1rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;margin-bottom:1.1rem}
@media(max-width:520px){.steps{grid-template-columns:repeat(2,1fr)}}
.step{
  padding:.7rem .65rem;border-radius:.85rem;border:1px solid var(--line);
  background:rgba(255,255,255,.03);display:flex;flex-direction:column;gap:.25rem;
  color:var(--muted);font-size:.8rem
}
.step.on{border-color:rgba(157,206,122,.45);background:rgba(157,206,122,.08);color:var(--ink)}
.step .sl{font-weight:700;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--growing)}
.play{
  margin-top:.35rem;width:100%;padding:1rem;border-radius:1rem;
  background:linear-gradient(180deg,#4aa35c,#2f7a3a);
  color:#fff;font-weight:700;font-size:1.05rem;
  box-shadow:0 10px 24px rgba(47,122,58,.35)
}
.play:hover{filter:brightness(1.05)}
.skill-actions{display:flex;gap:.5rem;margin-bottom:1rem}


/* topic list — light sheet matching Julius's Era screenshots */
.topic-sheet{
  display:none;margin-top:1rem;border-radius:1.1rem;overflow:hidden;
  background:#f7f4ee;color:#1c2430;border:1px solid rgba(0,0,0,.06);
  max-height:min(52vh,520px);overflow-y:auto;
}
.topic-sheet.show{display:block}
.topic-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  padding:1rem 1.1rem .55rem;position:sticky;top:0;background:#f7f4ee;z-index:1
}
.topic-head h3{margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.95rem;font-weight:600;color:#5c6678;letter-spacing:.02em}
.topic-head .frac{font-size:.8rem;color:#8a93a8}
.topic-tabs{display:flex;gap:.4rem;flex-wrap:wrap;padding:0 1.1rem .75rem;position:sticky;top:2.4rem;background:#f7f4ee;z-index:1}
.topic-tabs button{
  min-width:2.6rem;padding:.35rem .65rem;border-radius:999px;border:1.5px solid #d5d0c6;
  background:#fff;color:#8a93a8;font-size:.72rem;font-weight:600
}
.topic-tabs button.on{border-color:#3d8b4f;color:#2f7a3a;box-shadow:0 0 0 3px rgba(61,139,79,.12)}
.topic-rows{padding:0 .35rem .5rem}
.topic-row{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.75rem;
  width:100%;text-align:left;padding:.7rem .85rem;border:0;border-bottom:1px solid #ebe6dc;
  background:transparent;color:#1c2430;font:inherit;cursor:pointer
}
.topic-row:hover{background:rgba(255,255,255,.7)}
.topic-row .dot{
  width:12px;height:12px;border-radius:50%;border:1.5px dashed #8fbf8a;background:transparent;flex-shrink:0
}
.topic-row .dot.seed{border-style:solid;border-color:#b0b8c4;background:#c5cbd4}
.topic-row .dot.growing{border-style:solid;border-color:#9dce7a;background:#9dce7a}
.topic-row .dot.proven{border-style:solid;border-color:#2f7a3a;background:#2f7a3a}
.topic-row .code{font-size:.72rem;color:#8a93a8;font-variant-numeric:tabular-nums;margin-right:.4rem}
.topic-row .title{font-size:.92rem;font-weight:500}
.topic-row .tag{
  font-size:.68rem;font-weight:600;padding:.25rem .55rem;border-radius:999px;
  border:1px dashed #8fbf8a;color:#3d8b4f;text-transform:capitalize;background:transparent
}
.topic-row .tag.seed{border-color:#c5cbd4;color:#6a7384;border-style:solid;background:#eef0f4}
.topic-row .tag.growing{border-color:#9dce7a;color:#2f7a3a;background:#e5f5d8;border-style:solid}
.topic-row .tag.proven{border-color:#2f7a3a;color:#fff;background:#2f7a3a;border-style:solid}
.topic-row .tag.inferred{border-style:dashed}
.view-world .stage{min-height:320px;max-height:42vh}
.dock{bottom:calc(.75rem + env(safe-area-inset-bottom,0px))}

/* dock */
.dock{
  position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);
  width:min(920px, calc(100% - 1.5rem)); z-index:20;
}
.continue{
  width:100%;padding:1rem 1.2rem;border-radius:1rem;
  background:linear-gradient(180deg,#4aa35c,#2f7a3a);color:#fff;
  font-weight:700;font-size:1.05rem;box-shadow:0 12px 30px rgba(0,0,0,.35);text-align:left
}
.continue small{display:block;font-weight:500;opacity:.85;font-size:.75rem;margin-top:.2rem}

.toast{
  position:fixed;top:1rem;left:50%;transform:translateX(-50%);z-index:40;
  background:#1a2233;border:1px solid var(--line);padding:.55rem .9rem;border-radius:999px;
  font-size:.8rem;color:var(--muted);opacity:0;pointer-events:none;transition:opacity .25s
}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="app">
  <header class="top">
    <div class="brand"><em>Mathera</em></div>
    <nav class="nav">
      <button type="button" class="on" id="navMap" title="Universe">◎</button>
      <button type="button" id="navId" title="ID">◉</button>
      <button type="button" id="navRules" title="Rules">☰</button>
    </nav>
  </header>
  <div class="crumb" id="crumb"></div>

  <section class="view-universe" id="viewUniverse">
    <div class="universe">
      <svg class="path-svg" viewBox="0 0 1000 560" preserveAspectRatio="none" aria-hidden="true">
        <path d="M70 420 C 160 380, 220 300, 300 280 S 450 320, 520 250 S 680 160, 760 200 S 880 280, 940 160"
          fill="none" stroke="rgba(255,255,255,.12)" stroke-width="2" stroke-dasharray="6 8"/>
      </svg>
      <div class="uni-title">
        <h1>Seven worlds</h1>
        <p>a lifetime of discovery</p>
      </div>
      <div class="worlds" id="worlds"></div>
    </div>
  </section>

  <section class="view-world" id="viewWorld">
    <div class="world-head">
      <div>
        <h2 id="worldTitle">Solve</h2>
        <div class="meta" id="worldMeta"></div>
      </div>
      <div class="world-actions">
        <button type="button" class="ghost" id="zoomOutBtn" title="Zoom out / Esc">Zoom out</button>
      </div>
    </div>
    <div class="pills" id="domainPills"></div>
    <div class="stage" id="worldStage" data-metaphor="mountains">
      <svg id="mapSvg" viewBox="0 0 1200 780" preserveAspectRatio="xMidYMid meet" role="img" aria-label="World map"></svg>
    </div>
    <div class="hint-bar">
      <span>scroll to zoom</span>
      <span>drag to pan</span>
      <span>click district → zoom</span>
      <span>list below · same design</span>
      <span>esc → out</span>
    </div>
    <div class="topic-sheet" id="topicSheet">
      <div class="topic-head">
        <h3 id="topicTitle"></h3>
        <div class="frac" id="topicFrac"></div>
      </div>
      <div class="topic-tabs" id="topicTabs"></div>
      <div class="topic-rows" id="topicRows"></div>
    </div>
  </section>

  <section class="view-skill" id="viewSkill">
    <div class="panel">
      <div class="skill-actions">
        <button type="button" class="ghost" id="backWorld">← Map</button>
      </div>
      <div class="detail-art" id="skillArt"></div>
      <h2 id="skillTitle"></h2>
      <div id="skillMeta"></div>
      <div class="steps" id="skillSteps"></div>
      <button type="button" class="play" id="playBtn">Start</button>
    </div>
  </section>
</div>

<div class="dock">
  <button type="button" class="continue" id="continueBtn">Continue<small id="nextHint"></small></button>
</div>

<script src="app.js"></script>
</body>
</html>
