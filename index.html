<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Mathera</title>
<meta name="theme-color" content="#0a0e17"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0e17; --ink:#eef3ff; --muted:#8b97b3; --line:rgba(255,255,255,.1);
  --seed:#8a93a8; --growing:#9dce7a; --proven:#2f7a3a;
  --count:#4ade80; --operate:#c4a574; --relate:#9bb7ff;
  --solve:#c8d4e8; --prove:#e8d9a8; --motion:#5ec8d8; --space:#c4a0ff;
  --sheet:#f4f1ea; --sheet-ink:#1c2430; --sheet-muted:#7a8496;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Inter,system-ui,sans-serif;color:var(--ink);
  background:
    radial-gradient(800px 420px at 12% -8%, rgba(110,168,255,.13), transparent 55%),
    radial-gradient(640px 380px at 88% 0%, rgba(196,160,255,.1), transparent 50%),
    var(--bg);
  min-height:100%;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.app{max-width:980px;margin:0 auto;padding:1rem 1.15rem 6.5rem}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.85rem}
.brand{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:1.3rem;letter-spacing:-.02em}
.brand em{font-style:normal;background:linear-gradient(120deg,#6ea8ff,#8b7cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav{display:flex;gap:.35rem}
.nav button{
  width:2.2rem;height:2.2rem;border-radius:50%;border:1px solid var(--line);
  color:var(--muted);font-size:.9rem;background:rgba(255,255,255,.03)
}
.nav button.on{background:#eef3ff;color:#0a0e17;border-color:transparent}

.crumb{
  display:flex;align-items:center;gap:.35rem;min-height:1.4rem;margin-bottom:.9rem;
  color:var(--muted);font-size:.78rem;flex-wrap:wrap
}
.crumb button:hover{color:var(--ink)}
.crumb .sep{opacity:.35;user-select:none}

.view{display:none}
.view.show{display:block}

/* ── Universe ── */
.uni{
  position:relative;border:1px solid var(--line);border-radius:1.4rem;overflow:hidden;
  padding:1.75rem 1.1rem 2rem;
  background:linear-gradient(165deg,#0c1220,#10182a 45%,#0b1524);
}
.uni::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 18%,#fff,transparent),
    radial-gradient(1px 1px at 40% 70%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 72% 28%,#fff,transparent),
    radial-gradient(1px 1px at 88% 62%,#fff,transparent),
    radial-gradient(1px 1px at 55% 12%,#fff,transparent);
}
.uni-head{position:relative;text-align:center;z-index:1;margin-bottom:1.6rem}
.uni-head h1{margin:0;font-family:Fraunces,Georgia,serif;font-size:clamp(1.55rem,3.8vw,2.1rem);letter-spacing:-.02em}
.uni-head p{margin:.4rem 0 0;color:var(--muted);font-size:.75rem;letter-spacing:.16em;text-transform:uppercase}

.trail{
  position:relative;z-index:1;
  display:grid;grid-template-columns:repeat(7,minmax(0,1fr));
  gap:.55rem;align-items:start;
}
@media(max-width:760px){
  .trail{grid-template-columns:repeat(2,1fr);gap:.85rem}
}
.world{
  display:flex;flex-direction:column;align-items:center;gap:.45rem;
  padding:.7rem .4rem .85rem;border-radius:1.15rem;border:1px solid transparent;
  transition:transform .18s, background .18s, border-color .18s;
}
.world:not(.locked):hover{transform:translateY(-3px);background:rgba(255,255,255,.04);border-color:var(--line)}
.world.locked{opacity:.4;cursor:default}
.orb{
  width:68px;height:68px;border-radius:50%;display:grid;place-items:center;
  position:relative;box-shadow:0 10px 28px rgba(0,0,0,.4);
}
.orb svg{width:44px;height:44px}
.orb .lock{
  position:absolute;right:2px;bottom:-2px;width:20px;height:20px;border-radius:50%;
  background:#1a2233;border:1px solid var(--line);font-size:9px;display:grid;place-items:center
}
.w-roman{font-size:.65rem;letter-spacing:.14em;color:var(--muted);font-weight:600}
.w-name{font-family:Fraunces,Georgia,serif;font-size:.98rem;font-weight:700;text-align:center;line-height:1.15}
.w-place{font-size:.65rem;color:var(--muted);text-align:center;max-width:7.5rem;line-height:1.25;min-height:1.6rem}
.w-bar{width:48px;height:3px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:.15rem}
.w-bar i{display:block;height:100%;border-radius:inherit;background:currentColor}
.w-frac{font-size:.65rem;color:var(--muted);font-variant-numeric:tabular-nums}
.world[data-id="count"]{color:var(--count)}
.world[data-id="operate"]{color:var(--operate)}
.world[data-id="relate"]{color:var(--relate)}
.world[data-id="solve"]{color:var(--solve)}
.world[data-id="prove"]{color:var(--prove)}
.world[data-id="motion"]{color:var(--motion)}
.world[data-id="space"]{color:var(--space)}
.orb.count{background:radial-gradient(circle at 35% 30%,#9bf0b5,#1f6b3a 60%,#0d2a18)}
.orb.operate{background:radial-gradient(circle at 35% 30%,#e8d2a8,#7a5a32 60%,#2a1c0e)}
.orb.relate{background:radial-gradient(circle at 35% 30%,#c8d6ff,#3a5088 60%,#152038)}
.orb.solve{background:radial-gradient(circle at 35% 30%,#f5f8ff,#6a7a98 55%,#1c2436)}
.orb.prove{background:radial-gradient(circle at 35% 30%,#fff4d6,#a89058 55%,#2a2414)}
.orb.motion{background:radial-gradient(circle at 35% 30%,#a8f0ff,#1f6a7a 55%,#0c2430)}
.orb.space{background:radial-gradient(circle at 35% 30%,#e0c8ff,#5a3a98 55%,#180c30)}

/* ── World hub: district cards ── */
.world-hero{
  position:relative;border:1px solid var(--line);border-radius:1.25rem;overflow:hidden;
  padding:1.35rem 1.2rem 1.2rem;margin-bottom:1rem;min-height:140px;
}
.world-hero h2{margin:0;font-family:Fraunces,Georgia,serif;font-size:1.55rem;position:relative;z-index:1}
.world-hero .meta{margin:.35rem 0 0;color:var(--muted);font-size:.82rem;position:relative;z-index:1;max-width:34rem}
.world-hero .back{
  position:relative;z-index:1;margin-bottom:.75rem;
  padding:.3rem .7rem;border-radius:999px;border:1px solid var(--line);
  color:var(--muted);font-size:.75rem;background:rgba(0,0,0,.2)
}
.world-hero .art{position:absolute;inset:0;pointer-events:none;opacity:.9}
.world-hero[data-m="grove"]{background:linear-gradient(120deg,#142218,#0c1410)}
.world-hero[data-m="city"]{background:linear-gradient(120deg,#1a140c,#0e0a06)}
.world-hero[data-m="bridges"]{background:linear-gradient(120deg,#121a2c,#0a101c)}
.world-hero[data-m="mountains"]{background:linear-gradient(120deg,#141c2a,#0a1018)}
.world-hero[data-m="palace"]{background:linear-gradient(120deg,#1c1810,#0e0c08)}
.world-hero[data-m="ocean"]{background:linear-gradient(120deg,#0a1820,#061018)}
.world-hero[data-m="cosmos"]{background:radial-gradient(ellipse at 70% 40%,#1a1030,#07040f)}

.districts{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.75rem;
}
.district{
  text-align:left;padding:1rem 1rem .95rem;border-radius:1.05rem;
  border:1px solid var(--line);background:rgba(255,255,255,.035);
  transition:border-color .15s, transform .15s, background .15s;
  display:flex;flex-direction:column;gap:.45rem;min-height:118px;
}
.district:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.06)}
.district .did{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.72rem;
  letter-spacing:.04em;color:var(--muted);font-weight:600
}
.district .dname{font-family:Fraunces,Georgia,serif;font-size:1.05rem;font-weight:700;line-height:1.2}
.district .dmeta{margin-top:auto;font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between;gap:.5rem}
.district .pip{
  display:inline-flex;gap:3px;align-items:center
}
.district .pip i{width:6px;height:6px;border-radius:50%;background:var(--seed);opacity:.7}
.district .pip i.g{background:var(--growing)}
.district .pip i.p{background:var(--proven)}

/* ── Domain: light topic sheet (Julius design) ── */
.sheet{
  border-radius:1.15rem;overflow:hidden;background:var(--sheet);color:var(--sheet-ink);
  border:1px solid rgba(0,0,0,.06);box-shadow:0 18px 40px rgba(0,0,0,.28);
}
.sheet-top{
  display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;
  padding:1.05rem 1.15rem .5rem;flex-wrap:wrap
}
.sheet-top h3{
  margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:.92rem;font-weight:600;color:#5c6678;letter-spacing:.02em
}
.sheet-top .frac{font-size:.8rem;color:var(--sheet-muted);padding-top:.15rem}
.sheet-nav{display:flex;gap:.35rem;flex-wrap:wrap;padding:0 1.15rem .85rem}
.sheet-nav button{
  min-width:2.55rem;padding:.32rem .6rem;border-radius:999px;border:1.5px solid #d5d0c6;
  background:#fff;color:#8a93a8;font-size:.7rem;font-weight:600
}
.sheet-nav button.on{border-color:#3d8b4f;color:#2f7a3a;box-shadow:0 0 0 3px rgba(61,139,79,.12)}
.sheet-back{
  margin:0 1.15rem .65rem;padding:.28rem .65rem;border-radius:999px;
  border:1px solid #d5d0c6;color:#6a7384;font-size:.72rem;background:#fff
}
.rows{padding:0 .2rem .35rem}
.row{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.7rem;
  width:100%;text-align:left;padding:.72rem .95rem;border:0;border-bottom:1px solid #ebe6dc;
  background:transparent;color:var(--sheet-ink);font:inherit
}
.row:hover{background:rgba(255,255,255,.75)}
.row .dot{
  width:11px;height:11px;border-radius:50%;border:1.5px solid #c5cbd4;background:#c5cbd4;flex-shrink:0
}
.row .dot.inferred{border-style:dashed;border-color:#8fbf8a;background:transparent}
.row .dot.growing{border-color:#9dce7a;background:#9dce7a}
.row .dot.proven{border-color:#2f7a3a;background:#2f7a3a}
.row .code{font-size:.7rem;color:#8a93a8;font-variant-numeric:tabular-nums;margin-right:.4rem}
.row .title{font-size:.92rem;font-weight:500}
.row .tag{
  font-size:.66rem;font-weight:600;padding:.22rem .52rem;border-radius:999px;
  border:1px solid #c5cbd4;color:#6a7384;text-transform:capitalize;background:#eef0f4;white-space:nowrap
}
.row .tag.inferred{border-style:dashed;border-color:#8fbf8a;color:#3d8b4f;background:transparent}
.row .tag.growing{border-color:#9dce7a;color:#2f7a3a;background:#e5f5d8}
.row .tag.proven{border-color:#2f7a3a;color:#fff;background:#2f7a3a}

/* skill */
.panel{
  border:1px solid var(--line);border-radius:1.2rem;background:rgba(255,255,255,.03);
  padding:1.1rem 1.15rem 1.25rem
}
.detail-art{
  border-radius:1rem;overflow:hidden;aspect-ratio:16/9;margin-bottom:1rem;
  background:
    radial-gradient(circle at 30% 40%, rgba(110,168,255,.22), transparent 45%),
    linear-gradient(160deg,#1a2740,#0f1828);
  display:grid;place-items:center
}
.detail-art svg{width:38%;max-width:180px}
#skillTitle{margin:0 0 .35rem;font-family:Fraunces,Georgia,serif;font-size:1.4rem}
#skillMeta{color:var(--muted);font-size:.85rem;margin-bottom:1rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:.45rem;margin-bottom:1.1rem}
@media(max-width:520px){.steps{grid-template-columns:repeat(2,1fr)}}
.step{
  padding:.7rem .65rem;border-radius:.85rem;border:1px solid var(--line);
  background:rgba(255,255,255,.03);display:flex;flex-direction:column;gap:.25rem;
  color:var(--muted);font-size:.8rem
}
.step.on{border-color:rgba(157,206,122,.45);background:rgba(157,206,122,.08);color:var(--ink)}
.step .sl{font-weight:700;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--growing)}
.play{
  width:100%;padding:1rem;border-radius:1rem;
  background:linear-gradient(180deg,#4aa35c,#2f7a3a);
  color:#fff;font-weight:700;font-size:1.05rem;
  box-shadow:0 10px 24px rgba(47,122,58,.3)
}
.skill-actions{display:flex;gap:.5rem;margin-bottom:1rem}
.ghost{
  padding:.4rem .75rem;border-radius:999px;border:1px solid var(--line);
  color:var(--muted);font-size:.78rem;background:rgba(255,255,255,.03)
}

.dock{
  position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);
  width:min(640px, calc(100% - 1.5rem)); z-index:20;
}
.continue{
  width:100%;padding:1rem 1.15rem;border-radius:1rem;
  background:linear-gradient(180deg,#4aa35c,#2f7a3a);color:#fff;
  font-weight:700;font-size:1.02rem;box-shadow:0 12px 30px rgba(0,0,0,.35);text-align:left
}
.continue small{display:block;font-weight:500;opacity:.85;font-size:.74rem;margin-top:.2rem}

.toast{
  position:fixed;top:1rem;left:50%;transform:translateX(-50%);z-index:40;
  background:#1a2233;border:1px solid var(--line);padding:.55rem .9rem;border-radius:999px;
  font-size:.8rem;color:var(--muted);opacity:0;pointer-events:none;transition:opacity .25s
}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div class="app">
  <header class="top">
    <div class="brand"><em>Mathera</em></div>
    <nav class="nav">
      <button type="button" class="on" id="navMap" title="Universe">◎</button>
      <button type="button" id="navId" title="ID">◉</button>
      <button type="button" id="navRules" title="Rules">☰</button>
    </nav>
  </header>
  <div class="crumb" id="crumb"></div>

  <section class="view show" id="viewUniverse">
    <div class="uni">
      <div class="uni-head">
        <h1>Seven worlds</h1>
        <p>a lifetime of discovery</p>
      </div>
      <div class="trail" id="worlds"></div>
    </div>
  </section>

  <section class="view" id="viewWorld">
    <div class="world-hero" id="worldHero" data-m="grove">
      <button type="button" class="back" id="backUniverse">← Universe</button>
      <svg class="art" id="heroArt" viewBox="0 0 980 160" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>
      <h2 id="worldTitle">Count</h2>
      <p class="meta" id="worldMeta"></p>
    </div>
    <div class="districts" id="districts"></div>
  </section>

  <section class="view" id="viewDomain">
    <div class="sheet" id="topicSheet">
      <div class="sheet-top">
        <h3 id="topicTitle"></h3>
        <div class="frac" id="topicFrac"></div>
      </div>
      <div class="sheet-nav" id="topicTabs"></div>
      <button type="button" class="sheet-back" id="backWorld">← Districts</button>
      <div class="rows" id="topicRows"></div>
    </div>
  </section>

  <section class="view" id="viewSkill">
    <div class="panel">
      <div class="skill-actions">
        <button type="button" class="ghost" id="backDomain">← Topics</button>
      </div>
      <div class="detail-art" id="skillArt"></div>
      <h2 id="skillTitle"></h2>
      <div id="skillMeta"></div>
      <div class="steps" id="skillSteps"></div>
      <button type="button" class="play" id="playBtn">Start</button>
    </div>
  </section>
</div>

<div class="dock">
  <button type="button" class="continue" id="continueBtn">Continue<small id="nextHint"></small></button>
</div>

<script src="app.js"></script>
</body>
</html>
