<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Mathera — The Math Garden</title>
<meta name="theme-color" content="#070b12"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#070b12; --ink:#f4f1ea; --muted:#a8b0c4; --line:rgba(255,255,255,.12);
  --seed:#8a93a8; --growing:#9dce7a; --proven:#2f7a3a;
  --teal:#3d9b8f; --teal-glow:rgba(61,155,143,.35);
  --sheet:#f4f1ea; --sheet-ink:#1c2430; --sheet-muted:#7a8496;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#0a0e17;
  min-height:100%; overflow-x:hidden;
}
body.land,body.grove{background:#0a0e17}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.view{display:none}
.view.show{display:block}

/* ── Fullscreen tapestry landing ── */
.tapestry-land{
  position:relative; min-height:100dvh; min-height:100vh;
  display:flex; flex-direction:column;
}
.panels{
  flex:1; display:grid; grid-template-columns:repeat(7,minmax(0,1fr));
  min-height:100dvh; min-height:100vh;
}
@media(max-width:820px){
  .panels{grid-template-columns:1fr; min-height:auto}
  .panel{min-height:42vh}
}
.panel{
  position:relative; overflow:hidden; border:0; padding:0; text-align:center;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:transparent; border-right:1px solid rgba(255,255,255,.08);
  transition:opacity .2s;
}
.panel:last-child{border-right:0}
.panel:hover{opacity:.92}
.panel.locked{opacity:.35; cursor:default}
.panel.locked:hover{opacity:.35}
.panel-body{
  position:relative; z-index:2; padding:1.5rem .75rem; color:var(--ink);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.panel-name{
  font-family:Fraunces,Georgia,serif; font-size:clamp(1rem,1.8vw,1.45rem);
  font-weight:600; letter-spacing:.16em; text-transform:uppercase;
  color:rgba(230,235,245,.88);
}
.panel-roman{
  display:block; font-family:Fraunces,Georgia,serif; font-weight:600;
  font-size:clamp(.72rem,1.2vw,.95rem); letter-spacing:.28em;
  color:rgba(200,210,230,.55); margin-bottom:.45rem;
}
.panel:hover .panel-name{color:#fff}
.panel:hover .panel-roman{color:rgba(230,235,245,.78)}
.panel-lock{position:absolute;top:1rem;right:1rem;z-index:2;font-size:.8rem;opacity:.7}

/* ── Living Grove shell ── */
.grove-shell{
  position:relative; min-height:100dvh; min-height:100vh;
  display:grid; grid-template-columns:72px 1fr minmax(280px,340px);
  background:#0a1210;
  overflow:hidden;
}
.grove-shell::before{
  content:""; position:absolute; inset:0; z-index:0;
  background:
    radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(4,8,12,.28) 100%),
    linear-gradient(90deg, rgba(6,10,16,.38) 0%, transparent 14%, transparent 68%, rgba(6,10,16,.42) 100%),
    linear-gradient(180deg, rgba(6,10,16,.22) 0%, transparent 16%, transparent 88%, rgba(6,10,16,.35) 100%),
    var(--grove-bg, linear-gradient(180deg,#152218,#0a120c)) center / cover no-repeat;
  filter:saturate(1.08) contrast(1.02);
}
.grove-shell > *{position:relative; z-index:1}
.grove-shell.is-pointillist{
  background:#030405;
}
.grove-shell.is-pointillist::before{
  background:
    radial-gradient(ellipse at 50% 42%, transparent 28%, rgba(2,3,5,.55) 72%, rgba(0,0,0,.82) 100%),
    var(--grove-bg, radial-gradient(ellipse at 50% 40%, #12181a 0%, #080a0c 52%, #030405 100%)) center / cover no-repeat;
  filter:none;
}

/* Left era rail */
.era-rail{
  display:flex; flex-direction:column; align-items:center;
  padding:.85rem .4rem 1rem;
  background:rgba(6,10,16,.48);
  border-right:1px solid rgba(255,255,255,.07);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  gap:.15rem;
}
.era-rail-brand{
  text-align:center; margin-bottom:.75rem; padding:.2rem 0 .55rem;
  border-bottom:1px solid rgba(255,255,255,.08); width:100%;
}
.era-rail-brand .logo{
  font-family:Fraunces,Georgia,serif; font-size:.72rem; font-weight:700;
  letter-spacing:.06em; color:rgba(240,245,250,.9);
}
.era-rail-brand .tag{
  display:block; font-size:.42rem; letter-spacing:.12em; color:var(--muted);
  margin-top:.2rem; text-transform:uppercase;
}
.era-list{flex:1; display:flex; flex-direction:column; gap:.2rem; width:100%;}
.era-item{
  display:flex; flex-direction:column; align-items:center; gap:.12rem;
  padding:.45rem .2rem; border-radius:.7rem; width:100%;
  color:rgba(180,190,210,.55); transition:background .15s, color .15s, box-shadow .15s;
}
.era-item .ei{width:22px;height:22px;display:grid;place-items:center;opacity:.85}
.era-item .ei svg{width:18px;height:18px}
.era-item .el{
  font-size:.58rem; font-weight:700; letter-spacing:.14em; text-align:center;
  line-height:1.15; text-transform:uppercase;
  font-family:Fraunces,Georgia,serif;
}
.era-rail-brand .tag{display:none}
.world-map-btn{font-size:0; gap:0; letter-spacing:0; color:rgba(200,210,230,.7)}
.world-map-btn svg{width:18px;height:18px}
.era-item:hover{color:rgba(230,235,245,.85); background:rgba(255,255,255,.04)}
.era-item.on{
  color:#e8f6f3; background:rgba(61,155,143,.18);
  box-shadow:inset 0 0 0 1px rgba(61,155,143,.55), 0 0 18px rgba(61,155,143,.2);
}
.era-item.locked{opacity:.32; cursor:default}
.era-item.locked:hover{color:rgba(180,190,210,.55); background:transparent}
.era-rail-foot{margin-top:auto; display:flex; flex-direction:column; align-items:center; gap:.35rem; width:100%; padding-top:.5rem}
.world-map-btn{
  display:flex; flex-direction:column; align-items:center; gap:.15rem;
  padding:.45rem .25rem; border-radius:.7rem; width:100%;
  color:rgba(200,210,230,.7); font-size:.48rem; font-weight:700; letter-spacing:.08em;
  border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03);
}
.world-map-btn:hover{color:#fff; border-color:rgba(255,255,255,.25); background:rgba(255,255,255,.06)}
.world-map-btn svg{width:18px;height:18px}
.settings-stub{opacity:.35; padding:.3rem; color:var(--muted)}
.settings-stub svg{width:14px;height:14px}

/* Center stage */
.grove-stage{
  display:flex; flex-direction:column; min-width:0; min-height:0;
  padding:1rem 1.1rem .75rem;
  overflow:auto; /* leaf rows stay reachable; stage may scroll */
}
.grove-header{display:none} /* chrome stripped — painting + pills + leaves only */
.grove-header .era-kicker{
  font-size:.7rem; letter-spacing:.22em; text-transform:uppercase;
  color:rgba(210,230,220,.85); font-weight:600; margin:0 0 .25rem;
  text-shadow:0 1px 12px rgba(0,0,0,.5);
}
.grove-header h2{
  margin:0; font-family:Fraunces,Georgia,serif; font-weight:700;
  font-size:clamp(1.55rem, 3.2vw, 2.35rem); letter-spacing:.04em;
  color:#f2f6f3; text-shadow:0 2px 18px rgba(0,0,0,.55), 0 0 2px rgba(0,0,0,.4);
}
.grove-header .tagline{
  margin:.25rem 0 0; font-family:Fraunces,Georgia,serif; font-style:italic;
  font-size:.95rem; color:rgba(210,220,210,.75);
}
.grove-header .stats-row{
  display:flex; justify-content:center; align-items:center; gap:.65rem; margin-top:.55rem;
  pointer-events:auto;
}
.grove-pill{
  display:inline-flex; align-items:center; gap:.4rem;
  padding:.28rem .7rem; border-radius:999px;
  background:rgba(6,10,16,.42); border:1px solid rgba(255,255,255,.12);
  font-size:.68rem; color:rgba(220,230,230,.85); backdrop-filter:blur(6px);
}
.grove-pill svg{width:12px;height:12px; opacity:.85}

.grove-tree{
  position:relative; flex:1; min-height:320px;
  margin:.25rem 0 .5rem;
  overflow:visible; /* never clip full leaf rows */
}
.branch-node{
  position:absolute; z-index:3;
  display:flex; flex-direction:column; align-items:flex-start; gap:.28rem;
  max-width:none;
  overflow:visible;
  transition:transform .15s;
}
.branch-node:hover{transform:translateY(-1px)}
.branch-pill{
  display:inline-flex; align-items:center; gap:.4rem;
  padding:.34rem .62rem .34rem .45rem; border-radius:999px;
  background:rgba(4,8,12,.78); border:1px solid rgba(255,255,255,.16);
  color:rgba(230,235,240,.92); font-size:.58rem; font-weight:700;
  letter-spacing:.08em; text-transform:uppercase;
  box-shadow:0 4px 16px rgba(0,0,0,.4);
  transition:border-color .15s, box-shadow .15s, background .15s;
  white-space:nowrap; max-width:min(200px, 36vw);
  pointer-events:none; /* click handled by .branch-node */
}
.branch-node:hover .branch-pill{
  border-color:rgba(255,255,255,.32);
  background:rgba(8,12,18,.88);
}
.branch-node.on .branch-pill{
  border-color:rgba(61,155,143,.8);
  box-shadow:0 0 0 1px rgba(61,155,143,.45), 0 6px 20px rgba(61,155,143,.28);
  background:rgba(10,24,26,.9); color:#e8faf6;
}
.branch-pill .bn{
  display:grid; place-items:center; width:1.25rem; height:1.25rem; border-radius:50%;
  background:rgba(255,255,255,.1); font-size:.55rem; flex-shrink:0;
}
.branch-pill .bi{width:13px;height:13px; flex-shrink:0; opacity:.9; display:grid; place-items:center}
.branch-pill .bi svg{width:13px;height:13px}
.branch-pill .bt{overflow:hidden; text-overflow:ellipsis; min-width:0}

/* skill leaf dots under each domain pill — every skill is a visible leaf */
.leaf-row{
  display:flex; flex-wrap:wrap; gap:3px;
  min-width:min(280px, 90vw);
  max-width:min(340px, 42vw);
  padding:.15rem .35rem .2rem;
  pointer-events:auto;
  overflow:visible;
  border-radius:.45rem;
  transition:background .15s, box-shadow .15s;
}
.branch-node.on .leaf-row{
  background:rgba(61,155,143,.08);
  box-shadow:0 0 14px rgba(61,155,143,.22);
}
.leaf-dot{
  width:8px; height:8px; border-radius:50% 0 50% 50%;
  transform:rotate(-45deg); opacity:.9; flex-shrink:0;
  box-shadow:0 0 4px currentColor;
  cursor:pointer; pointer-events:auto;
  transition:transform .12s, box-shadow .12s, outline-color .12s;
}
.leaf-dot:hover{transform:rotate(-45deg) scale(1.35); opacity:1}
.leaf-dot.on{
  outline:1.5px solid #e8faf6;
  outline-offset:1px;
  box-shadow:0 0 8px currentColor, 0 0 0 2px rgba(61,155,143,.55);
  opacity:1;
  transform:rotate(-45deg) scale(1.3);
}
.leaf-dot.seed{background:#8a93a8; color:#8a93a8; opacity:.4}
.leaf-dot.inferred{background:transparent; border:1.3px solid #8fbf8a; color:#8fbf8a; opacity:.7; box-sizing:border-box}
.leaf-dot.growing{background:#9dce7a; color:#9dce7a}
.leaf-dot.proven{background:#2f7a3a; color:#3dca6a}
.leaf-dot.thirsty{background:#d4a017; color:#d4a017}
.leaf-dot.withered{background:#8b5a3c; color:#8b5a3c; opacity:.55}

/* ── Pointillist Living Grove (Count only) ── */
.pointillist-grove{
  position:absolute; inset:0;
  min-height:100%;
}
.pointillist-grove .grove-sil{
  position:absolute; inset:0; width:100%; height:100%;
  pointer-events:none; z-index:0;
  opacity:.95;
}
.grove-ambient-layer{
  position:absolute; inset:0; z-index:1; pointer-events:none;
}
.grove-ambient{
  position:absolute; width:var(--asz, 3px); height:var(--asz, 3px);
  margin:0; border-radius:50%;
  transform:translate(-50%, -50%);
  background:rgba(var(--ahue, 90,130,110), var(--aop, .14));
  box-shadow:0 0 5px rgba(70,120,95, calc(var(--aop, .14) * 1.6));
  pointer-events:none;
}
.pointillist-grove.style-stars .grove-ambient{
  background:rgba(115,145,165, calc(var(--aop, .14) * .65));
  box-shadow:0 0 6px rgba(90,130,170, calc(var(--aop, .14) * .85));
}
.pointillist-grove.style-mass .grove-ambient{
  box-shadow:0 0 6px rgba(70,130,100, calc(var(--aop, .14) * 1.8));
}
.grove-leaves{position:absolute; inset:0; z-index:2}
.grove-anchors{position:absolute; inset:0; z-index:4; pointer-events:none}

.grove-leaf{
  position:absolute; z-index:2;
  width:24px; height:24px; margin:0; padding:0;
  border:0; background:transparent; border-radius:50%;
  transform:translate(-50%, -50%);
  cursor:pointer; pointer-events:auto;
  display:grid; place-items:center;
  transition:opacity .18s, filter .18s, transform .12s;
}
.grove-leaf::before{
  content:""; width:11px; height:11px; border-radius:50%;
  box-shadow:0 0 7px currentColor, 0 0 14px rgba(61,155,143,.15);
  transition:transform .12s, box-shadow .12s, width .12s, height .12s, opacity .18s;
}
.grove-leaf:hover::before{transform:scale(1.4); box-shadow:0 0 12px currentColor, 0 0 22px rgba(61,155,143,.25)}
.grove-leaf.on::before{
  width:13px; height:13px;
  box-shadow:0 0 0 2px rgba(232,250,246,.9), 0 0 16px currentColor, 0 0 32px rgba(61,155,143,.5);
  transform:scale(1.28);
  animation:leafPulse 1.7s ease-in-out infinite;
}
@keyframes leafPulse{
  0%,100%{box-shadow:0 0 0 2px rgba(232,250,246,.85), 0 0 14px currentColor, 0 0 26px rgba(61,155,143,.4)}
  50%{box-shadow:0 0 0 2px rgba(232,250,246,1), 0 0 22px currentColor, 0 0 42px rgba(61,155,143,.65)}
}
.grove-leaf.seed{color:#5a6478; opacity:.32}
.grove-leaf.seed::before{background:#5a6478; box-shadow:0 0 3px rgba(90,100,120,.25)}
.grove-leaf.inferred{color:#9fd89a; opacity:.88}
.grove-leaf.inferred::before{background:transparent; border:1.5px solid #8fbf8a; box-sizing:border-box; width:10px; height:10px}
.grove-leaf.growing{color:#a8e08a; opacity:1}
.grove-leaf.growing::before{background:#9dce7a}
.grove-leaf.proven{color:#4adf78; opacity:1}
.grove-leaf.proven::before{background:#2f8a42}
.grove-leaf.thirsty{color:#e0b028; opacity:1}
.grove-leaf.thirsty::before{background:#d4a017}
.grove-leaf.withered{color:#8b5a3c; opacity:.48}
.grove-leaf.withered::before{background:#8b5a3c}

/* Progress bloom — soft halo for living leaves */
.grove-leaf.bloom::before{
  box-shadow:0 0 10px currentColor, 0 0 22px rgba(61,200,120,.35), 0 0 36px rgba(40,120,80,.2);
}
.grove-leaf.bloom.proven::before{
  box-shadow:0 0 12px #3dca6a, 0 0 28px rgba(61,200,120,.45), 0 0 48px rgba(40,160,90,.22);
}
.grove-leaf.bloom.growing::before{
  box-shadow:0 0 10px #9dce7a, 0 0 24px rgba(157,206,122,.4), 0 0 40px rgba(100,160,80,.18);
}
.grove-leaf.bloom.thirsty::before{
  box-shadow:0 0 10px #d4a017, 0 0 22px rgba(212,160,23,.4);
}
.grove-leaf.bloom.on::before{
  animation:leafPulse 1.7s ease-in-out infinite;
}

.pointillist-grove.domain-focus .grove-leaf:not(.cluster-on),
.pointillist-grove.domain-hover .grove-leaf:not(.cluster-on){
  opacity:.14; filter:grayscale(.5) brightness(.65);
}
.pointillist-grove.domain-focus .grove-leaf.cluster-on,
.pointillist-grove.domain-hover .grove-leaf.cluster-on{
  opacity:1; filter:none;
}
.pointillist-grove.domain-focus .grove-leaf.cluster-on.seed,
.pointillist-grove.domain-hover .grove-leaf.cluster-on.seed{opacity:.55}
.pointillist-grove.domain-focus .grove-leaf.cluster-on.inferred,
.pointillist-grove.domain-hover .grove-leaf.cluster-on.inferred{opacity:.92}
.pointillist-grove.domain-focus .grove-leaf.cluster-on.withered,
.pointillist-grove.domain-hover .grove-leaf.cluster-on.withered{opacity:.65}

/* Dim ambient when focusing a domain so skills read clearer */
.pointillist-grove.domain-focus .grove-ambient,
.pointillist-grove.domain-hover .grove-ambient{
  opacity:.35; transition:opacity .2s;
}

.domain-anchor{
  position:absolute; z-index:4; pointer-events:auto;
  transform:translate(-50%, -50%);
  display:inline-flex; align-items:center; gap:.32rem;
  padding:.28rem .5rem .28rem .34rem; border-radius:999px;
  background:rgba(4,8,12,.72); border:1px solid rgba(255,255,255,.12);
  color:rgba(220,230,235,.78); font-size:.52rem; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase;
  box-shadow:0 3px 12px rgba(0,0,0,.45);
  transition:border-color .15s, box-shadow .15s, background .15s, color .15s, opacity .18s;
  white-space:nowrap;
}
.domain-anchor.faint{
  background:rgba(4,8,12,.42); border-color:rgba(255,255,255,.07);
  color:rgba(200,215,220,.55); box-shadow:none;
  font-size:.48rem; padding:.2rem .4rem .2rem .28rem;
}
.domain-anchor:hover,
.domain-anchor.hover-on{
  border-color:rgba(255,255,255,.28);
  color:rgba(240,245,250,.95);
  background:rgba(8,12,18,.88);
}
.domain-anchor.on{
  border-color:rgba(61,155,143,.75);
  box-shadow:0 0 0 1px rgba(61,155,143,.4), 0 4px 16px rgba(61,155,143,.28);
  background:rgba(10,24,26,.92); color:#e8faf6;
}
.domain-anchor .bn{
  display:grid; place-items:center; width:1.1rem; height:1.1rem; border-radius:50%;
  background:rgba(255,255,255,.1); font-size:.5rem; flex-shrink:0;
}
.domain-anchor .bi{width:12px;height:12px; flex-shrink:0; opacity:.85; display:grid; place-items:center}
.domain-anchor .bi svg{width:12px;height:12px}
.domain-anchor .bt{font-size:.5rem; letter-spacing:.1em; opacity:.9}

.pointillist-grove.domain-focus .domain-anchor:not(.on),
.pointillist-grove.domain-hover .domain-anchor:not(.hover-on):not(.on){opacity:.32}
.pointillist-grove.domain-focus .domain-anchor.on,
.pointillist-grove.domain-hover .domain-anchor.hover-on{opacity:1}

.grove-style-toggle{
  position:absolute; z-index:5; left:50%; bottom:.15rem;
  transform:translateX(-50%);
  display:inline-flex; gap:2px; padding:2px;
  background:rgba(4,6,10,.55); border:1px solid rgba(255,255,255,.08);
  border-radius:999px; backdrop-filter:blur(8px);
  pointer-events:auto;
}
.grove-style-toggle .gst{
  border:0; background:transparent; color:rgba(180,195,205,.55);
  font-size:.52rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  padding:.28rem .55rem; border-radius:999px; cursor:pointer;
  transition:background .15s, color .15s;
}
.grove-style-toggle .gst:hover{color:rgba(230,240,245,.9)}
.grove-style-toggle .gst.on{
  background:rgba(61,155,143,.28); color:#e8faf6;
  box-shadow:inset 0 0 0 1px rgba(61,155,143,.45);
}

.grove-shell.is-pointillist .grove-tree{
  position:relative; flex:1; min-height:min(62vh, 560px);
  margin:0; overflow:hidden;
}
.grove-shell.is-pointillist .grove-legend{
  background:rgba(4,6,10,.55);
  border-color:rgba(255,255,255,.06);
  margin-bottom:1.65rem; /* room for style toggle above legend */
}

@media(max-width:960px){
  .grove-leaf{width:22px;height:22px}
  .grove-leaf::before{width:9px;height:9px}
  .domain-anchor{font-size:.48rem; padding:.24rem .42rem .24rem .3rem}
  .domain-anchor .bt{display:none} /* icon + number only on narrow */
}

.grove-legend{
  display:flex; flex-wrap:nowrap; align-items:center; justify-content:center; gap:.65rem;
  margin-top:auto; padding:.4rem .75rem;
  background:rgba(6,10,16,.4); border:1px solid rgba(255,255,255,.08);
  border-radius:999px; backdrop-filter:blur(8px);
  align-self:center; max-width:100%;
}
.grove-legend .lg{
  display:inline-flex; align-items:center; justify-content:center;
  width:1.35rem; height:1.35rem; border:0; padding:0; background:transparent;
  cursor:default;
}
.grove-legend .lg i{
  display:inline-block; width:11px; height:11px; border-radius:50% 0 50% 50%;
  transform:rotate(-45deg); flex-shrink:0;
}
.lg-seed i{background:transparent; border:1.5px solid #8a93a8; box-sizing:border-box; opacity:.7}
.lg-inferred i{background:transparent; border:1.5px dashed #8fbf8a; box-sizing:border-box}
.lg-growing i{background:#9dce7a}
.lg-proven i{background:#2f7a3a; box-shadow:0 0 6px #3dca6a}
.lg-thirsty i{background:#d4a017}
.lg-withered i{background:#8b5a3c}
.grove-legend .legend-tag{display:none}

/* Right detail panel */
.detail-panel{
  display:flex; flex-direction:column;
  background:rgba(6,10,16,.52);
  border-left:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  padding:1rem .9rem .85rem; min-height:0; overflow:hidden;
}
.detail-quote{display:none} /* quotes stripped */
.detail-panel.is-empty .detail-head,
.detail-panel.is-empty .skill-list,
.detail-panel.is-empty .skill-preview{display:none}
.detail-panel.is-empty::after{
  content:""; flex:1;
}
.detail-empty{
  flex:1; display:grid; place-items:center; padding:1rem;
  color:rgba(160,175,185,.35); font-size:.72rem; letter-spacing:.08em;
  text-transform:uppercase;
}
.detail-panel:not(.is-empty) .detail-empty{display:none}
.detail-head{
  display:flex; align-items:baseline; justify-content:space-between; gap:.5rem;
  margin-bottom:.55rem; padding:0 .1rem;
}
.detail-head h3{
  margin:0; font-family:Fraunces,Georgia,serif; font-size:1.15rem; font-weight:700;
  letter-spacing:.04em; color:#eef3f0;
}
.detail-head .dcount{font-size:.68rem; color:var(--muted); white-space:nowrap}

.skill-list{
  flex:1; overflow-y:auto; min-height:0;
  margin:0 -.25rem; padding:0 .25rem .5rem;
  scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.15) transparent;
}
.skill-row{
  display:grid; grid-template-columns:18px auto 1fr; align-items:center; gap:.45rem;
  width:100%; text-align:left; padding:.48rem .55rem; border-radius:.65rem;
  color:rgba(220,230,235,.82); transition:background .12s;
}
.skill-row:hover{background:rgba(255,255,255,.05)}
.skill-row.on{
  background:rgba(61,155,143,.22);
  box-shadow:inset 0 0 0 1px rgba(61,155,143,.4);
  color:#fff;
}
.skill-row .leaf{
  width:12px; height:12px; border-radius:50% 0 50% 50%; transform:rotate(-45deg);
}
.skill-row .leaf.seed{background:#8a93a8; opacity:.55}
.skill-row .leaf.inferred{background:transparent; border:1.5px dashed #8fbf8a; box-sizing:border-box}
.skill-row .leaf.growing{background:#9dce7a}
.skill-row .leaf.proven{background:#2f7a3a; box-shadow:0 0 5px #3dca6a}
.skill-row .leaf.thirsty{background:#d4a017}
.skill-row .leaf.withered{background:#8b5a3c}
.skill-row .scode{
  font-family:ui-monospace,Menlo,monospace; font-size:.66rem; color:rgba(160,175,185,.75);
}
.skill-row.on .scode{color:rgba(180,220,210,.85)}
.skill-row .stitle{font-size:.78rem; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.skill-preview{
  margin-top:.55rem; padding:.65rem;
  border-radius:.9rem; border:1px solid rgba(255,255,255,.1);
  background:rgba(8,12,20,.42);
  display:flex; flex-direction:column; gap:.45rem;
}
.preview-art{display:none} /* fluff art stripped */
.preview-meta .ptitle{
  font-family:Fraunces,Georgia,serif; font-size:.9rem; font-weight:700; margin:0;
  color:rgba(230,235,240,.92);
}
.preview-meta .pline{display:none} /* fluff lines stripped */
.begin-btn{
  display:flex; align-items:center; justify-content:center; gap:.4rem;
  width:100%; padding:.75rem; border-radius:.85rem;
  background:linear-gradient(180deg,#4aad9a,#2f7a6a); color:#fff; font-weight:700;
  font-size:.9rem; box-shadow:0 8px 22px rgba(47,122,106,.35);
}
.begin-btn:hover{filter:brightness(1.06)}
.begin-btn svg{width:14px;height:14px}

/* Skill detail (existing) */
.panel-skill{
  max-width:720px;margin:1rem auto 7.5rem;padding:1.1rem;
  border:1px solid var(--line);border-radius:1.15rem;background:rgba(255,255,255,.04)
}
.detail-art{border-radius:1rem;aspect-ratio:16/9;margin-bottom:1rem;background:linear-gradient(160deg,#1a2740,#0f1828);display:grid;place-items:center}
.detail-art svg{width:36%;max-width:160px}
#skillTitle{margin:0 0 .35rem;font-family:Fraunces,Georgia,serif;font-size:1.35rem}
#skillMeta{color:var(--muted);font-size:.85rem;margin-bottom:1rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-bottom:1rem}
@media(max-width:520px){.steps{grid-template-columns:repeat(2,1fr)}}
.step{padding:.65rem;border-radius:.8rem;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);font-size:.78rem}
.step.on{border-color:rgba(157,206,122,.45);background:rgba(157,206,122,.08);color:var(--ink)}
.step .sl{display:block;font-weight:700;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--growing);margin-bottom:.2rem}
.play{width:100%;padding:.95rem;border-radius:1rem;background:linear-gradient(180deg,#4aa35c,#2f7a3a);color:#fff;font-weight:700}
.ghost{
  padding:.35rem .75rem;border-radius:999px;border:1px solid var(--line);
  color:var(--muted);font-size:.75rem;background:rgba(255,255,255,.04)
}
.ghost:hover{color:var(--ink)}

.dock{position:fixed;left:50%;bottom:.85rem;transform:translateX(-50%);width:min(560px,calc(100% - 1.75rem));z-index:20;pointer-events:none}
.dock .continue{pointer-events:auto;width:100%;padding:.85rem 1.05rem;border-radius:1rem;background:linear-gradient(180deg,#4aa35c,#2f7a3a);color:#fff;font-weight:700;font-size:.95rem;box-shadow:0 12px 30px rgba(0,0,0,.4);text-align:left}
.continue small{display:block;font-weight:500;opacity:.85;font-size:.72rem;margin-top:.15rem}
.toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);z-index:40;background:#1a2233;border:1px solid var(--line);padding:.55rem .9rem;border-radius:999px;font-size:.8rem;color:var(--muted);opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}

body.land .dock, body.grove .dock{display:none}

/* Responsive: stack / collapse */
@media(max-width:960px){
  .grove-shell{grid-template-columns:64px 1fr}
  .detail-panel{
    position:fixed; right:0; top:0; bottom:0; width:min(340px,88vw); z-index:12;
    transform:translateX(100%); transition:transform .25s ease;
    box-shadow:-12px 0 40px rgba(0,0,0,.4);
  }
  .grove-shell.panel-open .detail-panel{transform:translateX(0)}
  .branch-pill{font-size:.52rem; padding:.28rem .5rem .28rem .38rem; max-width:min(170px, 42vw)}
  .leaf-row{min-width:min(240px, 85vw); max-width:min(300px, 55vw)}
  .leaf-dot{width:7px;height:7px}
}
@media(max-width:640px){
  .grove-shell{grid-template-columns:1fr}
  .era-rail{
    flex-direction:row; overflow-x:auto; padding:.45rem .5rem;
    border-right:0; border-bottom:1px solid rgba(255,255,255,.08);
    gap:.25rem; align-items:stretch;
  }
  .era-rail-brand,.era-rail-foot{display:none}
  .era-list{flex-direction:row; width:auto}
  .era-item{min-width:3.4rem; padding:.35rem .3rem}
  .grove-legend{border-radius:1rem; gap:.5rem}
}
</style>
</head>
<body class="land">
<div class="toast" id="toast"></div>

<section class="view show" id="viewUniverse">
  <div class="tapestry-land">
    <div class="panels" id="panels"></div>
  </div>
</section>

<section class="view" id="viewWorld">
  <div class="grove-shell" id="groveShell">
    <aside class="era-rail" id="eraRail" aria-label="Eras"></aside>

    <main class="grove-stage">
      <header class="grove-header">
        <p class="era-kicker" id="groveKicker">ERA I · COUNT</p>
        <h2 id="groveTitle">THE LIVING GROVE</h2>
        <p class="tagline" id="groveTagline">Things begin here.</p>
        <div class="stats-row">
          <span class="grove-pill" id="groveStats">
            <svg viewBox="0 0 16 16" fill="none"><path d="M8 13C8 13 3 9.5 3 6.5C3 4.5 4.5 3 6.2 3C7.2 3 8 3.6 8 3.6S8.8 3 9.8 3C11.5 3 13 4.5 13 6.5C13 9.5 8 13 8 13Z" stroke="currentColor" stroke-width="1.3"/></svg>
            <span id="groveStatsText">108 skills · 7 domains</span>
          </span>
        </div>
      </header>

      <div class="grove-tree" id="groveTree" aria-label="Domain branches"></div>

      <div class="grove-legend" id="groveLegend" aria-label="Leaf states">
        <span class="lg lg-seed" title="Seed"><i></i></span>
        <span class="lg lg-inferred" title="Inferred"><i></i></span>
        <span class="lg lg-growing" title="Growing"><i></i></span>
        <span class="lg lg-proven" title="Proven"><i></i></span>
        <span class="lg lg-thirsty" title="Thirsty"><i></i></span>
        <span class="lg lg-withered" title="Withered"><i></i></span>
      </div>
    </main>

    <aside class="detail-panel is-empty" id="detailPanel">
      <p class="detail-quote" id="detailQuote" hidden></p>
      <div class="detail-empty" id="detailEmpty" aria-hidden="true"></div>
      <div class="detail-head">
        <h3 id="detailDomainTitle"></h3>
        <span class="dcount" id="detailDomainCount"></span>
      </div>
      <div class="skill-list" id="skillList"></div>
      <div class="skill-preview" id="skillPreview">
        <div class="preview-art" id="previewArt"></div>
        <div class="preview-meta">
          <p class="ptitle" id="previewTitle"></p>
          <p class="pline" id="previewLine"></p>
        </div>
        <button type="button" class="begin-btn" id="beginBtn">
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l10-5.5L4 2.5z"/></svg>
          Begin
        </button>
      </div>
    </aside>
  </div>
</section>

<section class="view" id="viewSkill">
  <div class="panel-skill">
    <button type="button" class="ghost" id="backDomain" style="margin-bottom:1rem">← Grove</button>
    <div class="detail-art" id="skillArt"></div>
    <h2 id="skillTitle"></h2>
    <div id="skillMeta"></div>
    <div class="steps" id="skillSteps"></div>
    <button type="button" class="play" id="playBtn">Start</button>
  </div>
</section>

<div class="dock">
  <button type="button" class="continue" id="continueBtn">Continue<small id="nextHint"></small></button>
</div>
<script src="app.js"></script>
</body>
</html>
