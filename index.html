<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Mathera — The Math Garden</title>
<meta name="theme-color" content="#070b12"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#070b12; --ink:#f4f1ea; --muted:#a8b0c4; --line:rgba(255,255,255,.12);
  --seed:#8a93a8; --growing:#9dce7a; --proven:#2f7a3a;
  --sheet:#f4f1ea; --sheet-ink:#1c2430; --sheet-muted:#7a8496;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#0a0e17;
  min-height:100%; overflow-x:hidden;
}
body.land{background:#0a0e17}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.view{display:none}
.view.show{display:block}

/* ── Fullscreen tapestry landing ── */
.tapestry-land{
  position:relative; min-height:100dvh; min-height:100vh;
  display:flex; flex-direction:column;
}
.land-chrome{
  position:absolute; inset:0 0 auto 0; z-index:5;
  display:flex; justify-content:space-between; align-items:flex-start;
  gap:1rem; padding:1.1rem 1.35rem; pointer-events:none;
}
.land-chrome *{pointer-events:auto}
.land-brand{font-family:Fraunces,Georgia,serif; pointer-events:none}
.land-brand h1{margin:0;font-size:1.05rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.55}

.panels{
  flex:1; display:grid; grid-template-columns:repeat(7,minmax(0,1fr));
  min-height:100dvh; min-height:100vh;
}
@media(max-width:820px){
  .panels{grid-template-columns:1fr; min-height:auto}
  .panel{min-height:42vh}
  .land-quote{display:none}
}
.panel{
  position:relative; overflow:hidden; border:0; padding:0; text-align:center;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:transparent; border-right:1px solid rgba(255,255,255,.08);
  transition:opacity .2s;
}
.panel:last-child{border-right:0}
.panel:hover{opacity:.92}
.panel.locked{opacity:.35; cursor:default}
.panel.locked:hover{opacity:.35}
.panel-body{
  position:relative; z-index:2; padding:1.5rem .75rem; color:var(--ink);
  display:flex; align-items:center; justify-content:center;
}
.panel-name{
  font-family:Fraunces,Georgia,serif; font-size:clamp(1rem,1.8vw,1.45rem);
  font-weight:600; letter-spacing:.16em; text-transform:uppercase;
  color:rgba(230,235,245,.88);
}
.panel:hover .panel-name{color:#fff}
.panel-lock{position:absolute;top:1rem;right:1rem;z-index:2;font-size:.8rem;opacity:.7}


/* ── World tapestry ── */
.world-shell{min-height:100dvh; min-height:100vh; display:flex; flex-direction:column; padding-bottom:5.5rem}
.world-bar{
  display:flex; align-items:center; justify-content:space-between; gap:.75rem;
  padding:.75rem 1.1rem; border-bottom:1px solid var(--line); background:rgba(7,11,18,.92);
  position:sticky; top:0; z-index:8; backdrop-filter:blur(8px);
}
.world-bar h2{margin:0;font-family:Fraunces,Georgia,serif;font-size:1.25rem}
.world-bar .meta{color:var(--muted);font-size:.78rem}
.ghost{
  padding:.35rem .75rem;border-radius:999px;border:1px solid var(--line);
  color:var(--muted);font-size:.75rem;background:rgba(255,255,255,.04)
}
.ghost:hover{color:var(--ink)}

.tapestry-stage{
  position:relative; flex:1; min-height:min(68vh,720px);
  margin-bottom:0; border-bottom:1px solid var(--line); overflow:hidden; touch-action:none; cursor:grab;
  background:#0b1018;
}
.tapestry-stage.panning{cursor:grabbing}
.tapestry-stage[data-m="grove"]{background:linear-gradient(180deg,#152218,#0a120c)}
.tapestry-stage[data-m="city"]{background:linear-gradient(180deg,#1a140c,#0e0a06)}
.tapestry-stage[data-m="bridges"]{background:linear-gradient(180deg,#121a2c,#0a101c)}
.tapestry-stage[data-m="mountains"]{background:linear-gradient(180deg,#141c2a,#0a1018)}
.tapestry-stage[data-m="palace"]{background:linear-gradient(180deg,#1c1810,#0e0c08)}
.tapestry-stage[data-m="ocean"]{background:linear-gradient(180deg,#0a1820,#061018)}
.tapestry-stage[data-m="cosmos"]{background:radial-gradient(ellipse at 50% 40%,#1a1030,#07040f)}
#mapSvg{width:100%;height:100%;display:block}
.cluster{cursor:pointer}
.sknode{cursor:pointer}
.sknode.dim{opacity:.2;pointer-events:none}
.hint{text-align:center;font-size:.7rem;color:var(--muted);padding:.45rem;opacity:.85}

.districts{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.65rem;
  padding:1rem 1.1rem 7.5rem;
}
.district{
  text-align:left;padding:.9rem;border-radius:1rem;border:1px solid var(--line);
  background:rgba(255,255,255,.04); min-height:96px;
  display:flex;flex-direction:column;gap:.35rem;
}
.district:hover{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.22)}
.district .did{font-family:ui-monospace,Menlo,monospace;font-size:.7rem;color:var(--muted)}
.district .dname{font-family:Fraunces,Georgia,serif;font-size:1rem;font-weight:700}
.district .dmeta{margin-top:auto;font-size:.7rem;color:var(--muted)}

/* topic sheet */
.sheet{
  margin:0 1.1rem 7.5rem; border-radius:1.1rem; overflow:hidden;
  background:var(--sheet); color:var(--sheet-ink); border:1px solid rgba(0,0,0,.06);
  box-shadow:0 18px 40px rgba(0,0,0,.28);
}
.sheet-top{display:flex;justify-content:space-between;gap:1rem;padding:1rem 1.1rem .45rem;flex-wrap:wrap}
.sheet-top h3{margin:0;font-family:ui-monospace,Menlo,monospace;font-size:.9rem;color:#5c6678}
.sheet-top .frac{font-size:.8rem;color:var(--sheet-muted)}
.sheet-nav{display:flex;gap:.35rem;flex-wrap:wrap;padding:0 1.1rem .75rem}
.sheet-nav button{
  min-width:2.5rem;padding:.3rem .55rem;border-radius:999px;border:1.5px solid #d5d0c6;
  background:#fff;color:#8a93a8;font-size:.68rem;font-weight:600
}
.sheet-nav button.on{border-color:#3d8b4f;color:#2f7a3a;box-shadow:0 0 0 3px rgba(61,139,79,.12)}
.sheet-back{margin:0 1.1rem .55rem;padding:.28rem .65rem;border-radius:999px;border:1px solid #d5d0c6;color:#6a7384;font-size:.72rem;background:#fff}
.rows{padding:0 .2rem 1rem}
.row{
  display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.7rem;
  width:100%;text-align:left;padding:.7rem .95rem;border:0;border-bottom:1px solid #ebe6dc;
  background:transparent;color:var(--sheet-ink)
}
.row:hover{background:rgba(255,255,255,.75)}
.row .dot{width:11px;height:11px;border-radius:50%;border:1.5px solid #c5cbd4;background:#c5cbd4}
.row .dot.inferred{border-style:dashed;border-color:#8fbf8a;background:transparent}
.row .dot.growing{border-color:#9dce7a;background:#9dce7a}
.row .dot.proven{border-color:#2f7a3a;background:#2f7a3a}
.row .code{font-size:.7rem;color:#8a93a8;margin-right:.4rem}
.row .title{font-size:.9rem;font-weight:500}
.row .tag{font-size:.66rem;font-weight:600;padding:.2rem .5rem;border-radius:999px;border:1px solid #c5cbd4;color:#6a7384;background:#eef0f4;text-transform:capitalize}
.row .tag.inferred{border-style:dashed;border-color:#8fbf8a;color:#3d8b4f;background:transparent}
.row .tag.growing{border-color:#9dce7a;color:#2f7a3a;background:#e5f5d8}
.row .tag.proven{border-color:#2f7a3a;color:#fff;background:#2f7a3a}

.panel-skill{
  max-width:720px;margin:1rem auto 7.5rem;padding:1.1rem;
  border:1px solid var(--line);border-radius:1.15rem;background:rgba(255,255,255,.04)
}
.detail-art{border-radius:1rem;aspect-ratio:16/9;margin-bottom:1rem;background:linear-gradient(160deg,#1a2740,#0f1828);display:grid;place-items:center}
.detail-art svg{width:36%;max-width:160px}
#skillTitle{margin:0 0 .35rem;font-family:Fraunces,Georgia,serif;font-size:1.35rem}
#skillMeta{color:var(--muted);font-size:.85rem;margin-bottom:1rem}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem;margin-bottom:1rem}
@media(max-width:520px){.steps{grid-template-columns:repeat(2,1fr)}}
.step{padding:.65rem;border-radius:.8rem;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);font-size:.78rem}
.step.on{border-color:rgba(157,206,122,.45);background:rgba(157,206,122,.08);color:var(--ink)}
.step .sl{display:block;font-weight:700;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--growing);margin-bottom:.2rem}
.play{width:100%;padding:.95rem;border-radius:1rem;background:linear-gradient(180deg,#4aa35c,#2f7a3a);color:#fff;font-weight:700}

.crumb{padding:.55rem 1.1rem;font-size:.75rem;color:var(--muted);display:flex;gap:.35rem;flex-wrap:wrap;align-items:center}
.crumb button:hover{color:var(--ink)}
.crumb .sep{opacity:.35}

.dock{position:fixed;left:50%;bottom:.85rem;transform:translateX(-50%);width:min(560px,calc(100% - 1.75rem));z-index:20;pointer-events:none}
.dock .continue{pointer-events:auto;width:100%;padding:.85rem 1.05rem;border-radius:1rem;background:linear-gradient(180deg,#4aa35c,#2f7a3a);color:#fff;font-weight:700;font-size:.95rem;box-shadow:0 12px 30px rgba(0,0,0,.4);text-align:left}
.continue small{display:block;font-weight:500;opacity:.85;font-size:.72rem;margin-top:.15rem}
.toast{position:fixed;top:1rem;left:50%;transform:translateX(-50%);z-index:40;background:#1a2233;border:1px solid var(--line);padding:.55rem .9rem;border-radius:999px;font-size:.8rem;color:var(--muted);opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}

/* hide dock on landing */
body.land .dock{display:none}
</style>
</head>
<body class="land">
<div class="toast" id="toast"></div>

<section class="view show" id="viewUniverse">
  <div class="tapestry-land">
    <div class="panels" id="panels"></div>
  </div>
</section>

<section class="view" id="viewWorld">
  <div class="world-shell">
    <div class="world-bar">
      <div>
        <button type="button" class="ghost" id="backUniverse">← Garden</button>
        <h2 id="worldTitle" style="display:inline;margin-left:.55rem">World</h2>
        <div class="meta" id="worldMeta"></div>
      </div>
      <button type="button" class="ghost" id="zoomOutBtn">Zoom out</button>
    </div>
    <div class="crumb" id="crumb"></div>
    <div class="tapestry-stage" id="worldStage" data-m="grove">
      <svg id="mapSvg" viewBox="0 0 1400 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="World tapestry"></svg>
    </div>
    <div class="hint">scroll to zoom · drag to pan · click a district · every skill is on the painting</div>
    <div class="districts" id="districts"></div>
  </div>
</section>

<section class="view" id="viewDomain">
  <div class="crumb" id="crumbDomain"></div>
  <div class="sheet" id="topicSheet">
    <div class="sheet-top">
      <h3 id="topicTitle"></h3>
      <div class="frac" id="topicFrac"></div>
    </div>
    <div class="sheet-nav" id="topicTabs"></div>
    <button type="button" class="sheet-back" id="backWorld">← Tapestry</button>
    <div class="rows" id="topicRows"></div>
  </div>
</section>

<section class="view" id="viewSkill">
  <div class="panel-skill">
    <button type="button" class="ghost" id="backDomain" style="margin-bottom:1rem">← Topics</button>
    <div class="detail-art" id="skillArt"></div>
    <h2 id="skillTitle"></h2>
    <div id="skillMeta"></div>
    <div class="steps" id="skillSteps"></div>
    <button type="button" class="play" id="playBtn">Start</button>
  </div>
</section>

<div class="dock">
  <button type="button" class="continue" id="continueBtn">Continue<small id="nextHint"></small></button>
</div>
<script src="app.js"></script>
</body>
</html>
